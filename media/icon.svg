<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D1B69"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="20" fill="url(#bg)"/>
  <!-- Amphora/Vase body -->
  <ellipse cx="64" cy="88" rx="24" ry="18" fill="#D4A574" opacity="0.9"/>
  <ellipse cx="64" cy="72" rx="16" ry="6" fill="#D4A574" opacity="0.9"/>
  <rect x="48" y="72" width="32" height="16" fill="#D4A574" opacity="0.9"/>
  <!-- Amphora neck -->
  <rect x="56" y="56" width="16" height="16" rx="2" fill="#C4956A"/>
  <!-- Amphora rim -->
  <ellipse cx="64" cy="56" rx="12" ry="4" fill="#D4A574"/>
  <!-- Handles -->
  <path d="M 46 70 Q 36 78 44 90" stroke="#C4956A" stroke-width="3" fill="none"/>
  <path d="M 82 70 Q 92 78 84 90" stroke="#C4956A" stroke-width="3" fill="none"/>
  <!-- Code symbols floating out -->
  <text x="38" y="46" font-family="monospace" font-size="14" fill="#7B68EE" opacity="0.8">{</text>
  <text x="78" y="42" font-family="monospace" font-size="14" fill="#7B68EE" opacity="0.8">}</text>
  <text x="54" y="34" font-family="monospace" font-size="11" fill="#9B89FF" opacity="0.6">?</text>
  <!-- Magnifying glass -->
  <circle cx="88" cy="36" r="10" stroke="#FFD700" stroke-width="2.5" fill="none" opacity="0.8"/>
  <line x1="95" y1="43" x2="102" y2="50" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
</svg>
